name: Update IIM Timetable

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape timetable
        run: node scrape.js

      - name: Commit updated timetable
        run: |
          git config user.name "iim-timetable-bot"
          git config user.email "iim-timetable-bot@users.noreply.github.com"

          git add timetable.json

          if git diff --cached --quiet; then
            echo "No timetable changes."
          else
            git commit -m "Update timetable"
            git push
          fi
